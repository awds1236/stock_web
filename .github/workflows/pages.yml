# GitHub Pages 배포.
#
# Pages 는 정적 파일만 서빙하므로 FastAPI 백엔드가 거기서 돌 수 없습니다.
# 대신 이 워크플로가 CI 러너에서 수집·예측을 실행해 JSON 스냅샷을 만들고,
# Next.js 를 정적 모드로 빌드해 배포합니다.
#
#   - 미국 데이터: 키 없이 수집됩니다 (yfinance).
#   - 한국 데이터: 저장소 secret 에 KRX_AUTH_KEY 가 있으면 포함됩니다.
#     (Settings → Secrets and variables → Actions → New repository secret)
#     secret 은 저장소 파일에 남지 않습니다.
#
# 주의: schedule 트리거는 **기본 브랜치의 워크플로만** 실행합니다. 이 파일이
# 기본 브랜치에 있어야 매일 자동 갱신이 동작합니다.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/korean-stock-analysis-app-1nzt2k
  schedule:
    # 스냅샷 신선도는 이 스케줄이 정합니다.
    #
    # 하루 한 번이면 화면의 분석 수치가 최대 24시간 낡습니다. 그렇다고 5분마다
    # 돌릴 수는 없습니다 -- 매 실행이 전체 수집 + 예측 + 빌드 + 배포이고,
    # Actions 분과 무료 소스 요청량을 모두 소모합니다.
    #
    # 가격의 실시간성은 여기서 해결하지 않습니다. 브라우저가 직접 시세를
    # 갱신하므로(1분 주기), 이 스케줄은 **분석 수치의 신선도**만 담당합니다.
    #
    # 미국 장중(14:30~21:00 UTC) 2시간마다 + 마감 후 확정 1회.
    - cron: "30 14,16,18,20 * * 1-5"
    # 매 영업일 22:30 UTC = 미국 장 마감(21:00 UTC) 이후.
    - cron: "30 22 * * 1-5"
    # **한국 데이터는 여기서 들어옵니다.** 23:30 UTC = 다음날 08:30 KST.
    #
    # KRX Open API 는 일별 데이터를 **매일 08:00 KST 에 갱신**합니다. 즉 T일
    # 시세는 T+1일 08:00 이후에야 조회됩니다. 이전 스케줄은 이 시각을 전부
    # 비켜갔습니다 -- 07:00 UTC(16:00 KST)는 장 마감 직후지만 갱신 전이고,
    # 22:30 UTC(07:30 KST)는 갱신 30분 전이었습니다. 그래서 배포된 화면의
    # 한국 최신 일자가 늘 하루 뒤처졌습니다(7/31 장이 끝났는데 7/30 까지만).
    #
    # 일요일~목요일 23:30 UTC = 월~금 08:30 KST 입니다.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 백엔드 설치
        run: pip install ./backend

      # 수집한 데이터를 실행 간에 이어받습니다.
      #
      # 왜 필요한가: KRX Open API 는 **하루치씩만** 줍니다. 10년치는 약 5,000회
      # 요청이라 한 번의 실행으로는 받을 수 없고, 러너는 매번 빈 상태로 시작하니
      # 캐시가 없으면 영원히 최근 구간만 반복해서 받게 됩니다. 실제로 한국
      # 데이터가 19일치에 머물러 시장·예측 화면이 통째로 비어 있었습니다.
      #
      # DuckDB 파일만 담습니다. 원본 JSON 응답 캐시(backend/data/cache)는 이미
      # DB 에 들어간 내용이라 중복이고, 전 종목 일별 응답이라 수 GB 가 됩니다.
      #
      # 키에 run_id 를 넣고 restore-keys 로 접두사를 두는 것은 "매번 새로
      # 저장하되 가장 최근 것을 복원한다"는 관용적 방법입니다. 같은 키를 쓰면
      # 첫 저장 이후 갱신되지 않아 히스토리가 자라지 않습니다.
      - name: 수집 데이터 복원
        uses: actions/cache/restore@v4
        with:
          path: backend/data/stock.duckdb
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 데이터 수집 + 스냅샷 생성
        env:
          # 없으면 미국만 배포됩니다. KR 포함하려면 repo secret 에 추가.
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python backend/scripts/export_static.py --out frontend/public/data

      # **수집 직후에, 실패해도 저장합니다.**
      #
      # `actions/cache` 한 덩어리로 쓰면 저장이 잡 마지막의 post 단계에서
      # 일어나는데, 그 단계는 잡이 실패하면 건너뛰어집니다. 실제로 스냅샷
      # 생성이 크래시한 실행에서 그날 받은 1,100거래일이 통째로 버려졌고,
      # 다음 실행이 처음부터 다시 받아야 했습니다.
      #
      # KRX 백필은 이 파이프라인에서 가장 비싼 작업(약 2,200회 요청)이므로,
      # 뒤 단계가 무엇을 하든 받아둔 것은 남겨야 합니다.
      - name: 수집 데이터 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data/stock.duckdb
          key: stock-db-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성
        working-directory: frontend
        run: npm ci

      - name: 정적 빌드
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 아래에 서빙됩니다.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 가 아직 활성화되지 않았으면 자동 활성화합니다.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
