# GitHub Pages 배포.
#
# Pages 는 정적 파일만 서빙하므로 FastAPI 백엔드가 거기서 돌 수 없습니다.
# 대신 이 워크플로가 CI 러너에서 수집·예측을 실행해 JSON 스냅샷을 만들고,
# Next.js 를 정적 모드로 빌드해 배포합니다.
#
#   - 미국 데이터: 키 없이 수집됩니다 (yfinance).
#   - 한국 데이터: 저장소 secret 에 KRX_AUTH_KEY 가 있으면 포함됩니다.
#     (Settings → Secrets and variables → Actions → New repository secret)
#     secret 은 저장소 파일에 남지 않습니다.
#
# 주의: schedule 트리거는 **기본 브랜치의 워크플로만** 실행합니다. 이 파일이
# 기본 브랜치에 있어야 매일 자동 갱신이 동작합니다.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/korean-stock-analysis-app-1nzt2k
  schedule:
    # 스냅샷 신선도는 이 스케줄이 정합니다.
    #
    # 하루 한 번이면 화면의 분석 수치가 최대 24시간 낡습니다. 그렇다고 5분마다
    # 돌릴 수는 없습니다 -- 매 실행이 전체 수집 + 예측 + 빌드 + 배포이고,
    # Actions 분과 무료 소스 요청량을 모두 소모합니다.
    #
    # 가격의 실시간성은 여기서 해결하지 않습니다. 브라우저가 직접 시세를
    # 갱신하므로(1분 주기), 이 스케줄은 **분석 수치의 신선도**만 담당합니다.
    #
    # 미국 장중(14:30~21:00 UTC) 2시간마다 + 마감 후 확정 1회.
    - cron: "30 14,16,18,20 * * 1-5"
    # 매 영업일 22:30 UTC = 미국 장 마감(21:00 UTC) 이후.
    # 한국 시간으로는 다음날 07:30 -- KRX 확정 수급(18:00 KST)도 반영됩니다.
    - cron: "30 22 * * 1-5"
    # 한국 장 마감(06:30 UTC) 이후 -- 한국 데이터가 있는 배포용.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 백엔드 설치
        run: pip install ./backend

      # 수집한 데이터를 실행 간에 이어받습니다.
      #
      # 왜 필요한가: KRX Open API 는 **하루치씩만** 줍니다. 10년치는 약 5,000회
      # 요청이라 한 번의 실행으로는 받을 수 없고, 러너는 매번 빈 상태로 시작하니
      # 캐시가 없으면 영원히 최근 구간만 반복해서 받게 됩니다. 실제로 한국
      # 데이터가 19일치에 머물러 시장·예측 화면이 통째로 비어 있었습니다.
      #
      # DuckDB 파일만 담습니다. 원본 JSON 응답 캐시(backend/data/cache)는 이미
      # DB 에 들어간 내용이라 중복이고, 전 종목 일별 응답이라 수 GB 가 됩니다.
      #
      # 키에 run_id 를 넣고 restore-keys 로 접두사를 두는 것은 "매번 새로
      # 저장하되 가장 최근 것을 복원한다"는 관용적 방법입니다. 같은 키를 쓰면
      # 첫 저장 이후 갱신되지 않아 히스토리가 자라지 않습니다.
      - name: 수집 데이터 캐시
        uses: actions/cache@v4
        with:
          path: backend/data/stock.duckdb
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: 데이터 수집 + 스냅샷 생성
        env:
          # 없으면 미국만 배포됩니다. KR 포함하려면 repo secret 에 추가.
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python backend/scripts/export_static.py --out frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성
        working-directory: frontend
        run: npm ci

      - name: 정적 빌드
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 아래에 서빙됩니다.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 가 아직 활성화되지 않았으면 자동 활성화합니다.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
